version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd personal-portfolio/personal-portfolio
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: personal-portfolio/personal-portfolio/build
    files:
      - '**/*'
  cache:
    paths:
      - personal-portfolio/personal-portfolio/node_modules/**/*